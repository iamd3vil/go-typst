[package]
name = "typst-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
chrono = "0.4"
comemo = "0.5"
tikv-jemallocator = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
